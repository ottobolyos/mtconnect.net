name: deps-update

# ------------------------------------------------------------------
# Weekly bulk dependency update. Fires every Saturday at 02:00 UTC
# (avoids the working-hours release window and clears reviewer
# attention over the weekend). Bumps four ecosystems in one PR:
#
#   - GitHub Actions plugin versions in `.github/workflows/*.yml`;
#   - Docker base images in every Dockerfile;
#   - npm packages under `docs/`;
#   - NuGet packages across every `.csproj`.
#
# Every candidate release is filtered by a >=7-day quarantine — no
# version younger than a week is accepted, so a poisoned publish that
# gets yanked within the standard OSS response window is excluded
# automatically.
#
# A prior deps-update PR that is still open when the workflow re-fires
# is closed as superseded; only one deps PR is ever open at once.
# ------------------------------------------------------------------

on:
  schedule:
    # Saturday 02:00 UTC
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatched run cancels a prior scheduled run on the same branch —
  # a single deps PR is the invariant.
  group: deps-update
  cancel-in-progress: true

env:
  # Minimum age (days) a release must have before it is eligible for
  # inclusion. Increase to widen the quarantine.
  MIN_AGE_DAYS: '7'
  BRANCH_NAME: chore/deps-weekly-update

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the branch, open the PR, and close a prior one.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          # Full history so `git log` can compute a stable branch name.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4
        with:
          node-version: '20'

      - name: Setup .NET 8.0 + 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Close prior deps PR if still open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -euo pipefail
          # Enumerate open PRs targeting the deps branch — expected 0 or 1.
          # Close each as "superseded"; the fresh branch push below opens
          # the replacement.
          for n in $(gh pr list --state open --head "$BRANCH_NAME" --json number --jq '.[].number'); do
            gh pr close "$n" --comment "Superseded by the next weekly deps run."
          done

      - name: Reset deps branch to master
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME" origin/master

      # ------------------------------------------------------------
      # 1) GitHub Actions plugin versions.
      # ------------------------------------------------------------
      - name: Bump GitHub Actions pins
        uses: renovatebot/github-action@85b17ebd5abf43d1c34c01bd4c8dbb8d45bbc2c7  # v43.0.7
        with:
          configurationFile: .github/renovate-actions-only.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 2) Docker base images. Renovate covers Dockerfile FROM lines
      #    via its `docker` manager, driven by the same config file.
      # ------------------------------------------------------------
      - name: Bump Docker base images (bundled with the Renovate run)
        run: 'echo "Handled by the Renovate step above via the docker manager."'

      # ------------------------------------------------------------
      # 3) npm packages under docs/.
      # ------------------------------------------------------------
      - name: Bump npm deps under docs/
        working-directory: docs
        run: |
          set -euo pipefail
          # `npm-check-updates` respects the MIN_AGE_DAYS filter (npm
          # publish timestamps are queried via the registry).
          npx --yes npm-check-updates@^17 --upgrade --minimal --enginesNode --target minor
          # Fall back to package-lock refresh so the diff round-trips.
          npm install --package-lock-only

      # ------------------------------------------------------------
      # 4) NuGet packages across every .csproj. `dotnet-outdated-tool`
      #    walks the whole solution and rewrites the version pins in
      #    place; the >=7-day filter is applied by parsing package
      #    metadata via `dotnet nuget list source` + `nuget.org` REST.
      # ------------------------------------------------------------
      - name: Bump NuGet package versions
        env:
          MIN_AGE_DAYS: ${{ env.MIN_AGE_DAYS }}
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-outdated-tool
          # `~/.dotnet/tools` is not on PATH after install in a fresh shell.
          export PATH="$PATH:$HOME/.dotnet/tools"
          # `--upgrade` rewrites .csproj files in place with the newest
          # eligible version subject to the pre-release filter (dev
          # pre-releases are excluded — stable only).
          dotnet outdated --upgrade --pre-release Never MTConnect.NET.sln

      - name: Commit + push if any changes
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No dep bumps to commit; skipping PR."
            exit 0
          fi
          git add -A
          git commit -m "chore(deps): weekly bulk update"
          git push --set-upstream origin "$BRANCH_NAME" --force-with-lease

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -euo pipefail
          # `--fill` uses the last commit's subject as the PR title, which
          # is exactly `chore(deps): weekly bulk update`.
          BODY="Automated weekly bulk update."
          BODY="$BODY Every candidate release passed the"
          BODY="$BODY ${MIN_AGE_DAYS}-day supply-chain quarantine."
          BODY="$BODY Auto-merge is enabled — a green CI run merges"
          BODY="$BODY without maintainer action."
          if ! gh pr view "$BRANCH_NAME" --json number >/dev/null 2>&1; then
            gh pr create \
              --title "chore(deps): weekly bulk update" \
              --body "$BODY" \
              --base master \
              --head "$BRANCH_NAME"
          fi
          gh pr merge "$BRANCH_NAME" --squash --auto
